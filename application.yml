spring:
  application:
    name: logicflow-api
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logicflow_java}
    username: ${DB_USER:postgres}
    password:  ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  admin:
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}