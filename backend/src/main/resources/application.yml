server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/LogicFlow
    username: logicflow
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    time-zone: America/Recife